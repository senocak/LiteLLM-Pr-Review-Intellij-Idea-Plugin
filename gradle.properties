group = com.github.senocak.prreview
version = 1.0.0

# IntelliJ IDEA build compiled against, and the range the plugin is published for.
platformVersion = 2025.3.5
# 253 = 2025.3, which is the floor the code actually supports. Git4Idea moved
# GitRepositoryManager and friends out of com.intellij.dvcs.repo into git4idea.repo in 2025.3, so
# advertising 2024.3 (243) support would resolve against a platform where this plugin cannot load.
# There is no until-build: since 2024.3 it is what stops a plugin installing into a newer IDE.
plugin.sinceBuild = 253

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
